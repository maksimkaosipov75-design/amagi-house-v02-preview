<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Восемь дневных PNG-рендеров дома Amagi Mystery из Blender для визуальной оценки архитектуры.">
  <title>Amagi Mystery · Дом v02</title>
  <style>
    :root { color-scheme: dark; --bg:#171a1b; --card:#222627; --line:#3a4140; --ink:#f0ede5; --muted:#c5cac4; --warm:#e4cda6; }
    * { box-sizing:border-box; }
    html { scroll-padding-top:1rem; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
    main { width:min(100% - 2rem, 76rem); margin:auto; padding:clamp(2rem,7vw,5rem) 0 3rem; }
    header { margin:0 0 2rem; }
    .eyebrow { color:var(--warm); letter-spacing:.16em; text-transform:uppercase; font-size:.75rem; font-weight:700; margin:0 0 .65rem; }
    h1 { font-size:clamp(2.25rem,5.5vw,4.45rem); font-weight:630; line-height:1.04; letter-spacing:-.045em; margin:0 0 .8rem; }
    .intro { color:var(--muted); margin:0; max-width:42rem; }
    nav { display:flex; flex-wrap:wrap; gap:.55rem; margin-top:1.2rem; }
    nav a { border:1px solid var(--line); border-radius:999px; padding:.36rem .8rem; }
    h2 { font-size:clamp(1.45rem,3vw,2rem); font-weight:630; letter-spacing:-.026em; margin:2.4rem 0 .9rem; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(.75rem,2vw,1.4rem); }
    figure { margin:0; border:1px solid var(--line); border-radius:.65rem; background:var(--card); overflow:hidden; }
    .wide { grid-column:1 / -1; }
    img { display:block; width:100%; height:auto; aspect-ratio:4 / 3; background:#777d7a; }
    .image { display:block; cursor:zoom-in; }
    figcaption { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:.25rem 1rem; padding:.7rem .9rem; }
    figcaption span { font-weight:620; }
    a { color:var(--warm); text-underline-offset:.18em; }
    nav a { text-decoration:none; }
    a:hover { color:#fff0d4; }
    a:focus-visible { outline:2px solid #fff0d4; outline-offset:3px; }
    .image:focus-visible { outline-offset:-4px; }
    footer { margin-top:2rem; color:var(--muted); font-size:.88rem; }
    @media (max-width:43rem) {
      main { width:calc(100% - 1.25rem); }
      .grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main id="top">
    <header>
      <p class="eyebrow">Amagi Mystery · Blender</p>
      <h1>Дом Амаги v02</h1>
      <p class="intro">Восемь ракурсов при одинаковом дневном освещении. Нажмите на изображение, чтобы открыть оригинал PNG размером 1760 × 1320.</p>
      <nav aria-label="Разделы галереи">
        <a href="#overview">Общий вид</a>
        <a href="#facades">Фасады</a>
        <a href="#details">Вход и материалы</a>
      </nav>
    </header>
    <section id="overview" aria-label="Общий вид">
        <figure id="05-three-quarter" class="wide">
          <a class="image" href="images/05-three-quarter.png" aria-label="Вид под углом ¾. Открыть PNG в полном размере">
            <img src="images/05-three-quarter.png" alt="Дом в три четверти. Видны передний и правый фасады, крыльцо и скаты крыши." width="1760" height="1320" fetchpriority="high" decoding="async">
          </a>
          <figcaption><span>Вид под углом ¾</span><a href="images/05-three-quarter.png" aria-label="Вид под углом ¾. Открыть PNG">Открыть PNG ↗</a></figcaption>
        </figure>
    </section>
    <section id="facades" aria-labelledby="facades-title">
      <h2 id="facades-title">Фасады и вид сверху</h2>
      <div class="grid">
        <figure id="01-front">
          <a class="image" href="images/01-front.png" aria-label="Вид спереди. Открыть PNG в полном размере">
            <img src="images/01-front.png" alt="Передний фасад со входом под навесом, большим окном, ступенями и низкой оградой." width="1760" height="1320" loading="lazy" decoding="async">
          </a>
          <figcaption><span>Вид спереди</span><a href="images/01-front.png" aria-label="Вид спереди. Открыть PNG">Открыть PNG ↗</a></figcaption>
        </figure>
        <figure id="02-rear">
          <a class="image" href="images/02-rear.png" aria-label="Вид сзади. Открыть PNG в полном размере">
            <img src="images/02-rear.png" alt="Задний фасад с остеклённым проёмом, окном и деревянной служебной створкой." width="1760" height="1320" loading="lazy" decoding="async">
          </a>
          <figcaption><span>Вид сзади</span><a href="images/02-rear.png" aria-label="Вид сзади. Открыть PNG">Открыть PNG ↗</a></figcaption>
        </figure>
        <figure id="03-left">
          <a class="image" href="images/03-left.png" aria-label="Вид слева. Открыть PNG в полном размере">
            <img src="images/03-left.png" alt="Левый боковой фасад с выступом крыши, окном и деревянной облицовкой." width="1760" height="1320" loading="lazy" decoding="async">
          </a>
          <figcaption><span>Вид слева</span><a href="images/03-left.png" aria-label="Вид слева. Открыть PNG">Открыть PNG ↗</a></figcaption>
        </figure>
        <figure id="04-right">
          <a class="image" href="images/04-right.png" aria-label="Вид справа. Открыть PNG в полном размере">
            <img src="images/04-right.png" alt="Правый боковой фасад с окнами, наружным блоком и карнизом." width="1760" height="1320" loading="lazy" decoding="async">
          </a>
          <figcaption><span>Вид справа</span><a href="images/04-right.png" aria-label="Вид справа. Открыть PNG">Открыть PNG ↗</a></figcaption>
        </figure>
        <figure id="06-top" class="wide">
          <a class="image" href="images/06-top.png" aria-label="Вид сверху. Открыть PNG в полном размере">
            <img src="images/06-top.png" alt="Ортографический вид сверху. Видны план крыши, стык скатов, навес и контур участка." width="1760" height="1320" loading="lazy" decoding="async">
          </a>
          <figcaption><span>Вид сверху</span><a href="images/06-top.png" aria-label="Вид сверху. Открыть PNG">Открыть PNG ↗</a></figcaption>
        </figure>
      </div>
    </section>
    <section id="details" aria-labelledby="details-title">
      <h2 id="details-title">Вход и материалы</h2>
      <div class="grid">
        <figure id="07-entry" class="wide">
          <a class="image" href="images/07-entry.png" aria-label="Вход и раздвижные двери. Открыть PNG в полном размере">
            <img src="images/07-entry.png" alt="Крупный план закрытых решётчатых створок, направляющих, крыльца и светильника." width="1760" height="1320" loading="lazy" decoding="async">
          </a>
          <figcaption><span>Вход и раздвижные двери</span><a href="images/07-entry.png" aria-label="Вход и раздвижные двери. Открыть PNG">Открыть PNG ↗</a></figcaption>
        </figure>
        <figure id="08-roof-windows" class="wide">
          <a class="image" href="images/08-roof-windows.png" aria-label="Крыша, окна и материалы. Открыть PNG в полном размере">
            <img src="images/08-roof-windows.png" alt="Крупный план черепицы, стыков скатов, деревянной отделки и остекления фасада." width="1760" height="1320" loading="lazy" decoding="async">
          </a>
          <figcaption><span>Крыша, окна и материалы</span><a href="images/08-roof-windows.png" aria-label="Крыша, окна и материалы. Открыть PNG">Открыть PNG ↗</a></figcaption>
        </figure>
      </div>
    </section>
    <footer>Модель <code>Amagi_Residential_House_v02.blend</code> · <a href="#top">Наверх ↑</a></footer>
  </main>
</body>
</html>
